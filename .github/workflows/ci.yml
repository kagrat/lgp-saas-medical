name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lgp
          POSTGRES_PASSWORD: lgp_ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lgp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-0123456789
      TEST_POSTGRES_URL: postgresql://lgp:lgp_ci@localhost:5432/postgres
      DATABASE_URL: sqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances (verrouillees, avec verification des empreintes)
        run: pip install --require-hashes -r requirements.txt && pip install --require-hashes -r requirements-dev.txt
      - name: Tests (SQLite + PostgreSQL reel pour les migrations)
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered
      - name: Audit des vulnerabilites connues
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          VITE_API_URL: https://example.up.railway.app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image du backend (comme sur Railway)
        run: docker build -t lgp-backend backend
