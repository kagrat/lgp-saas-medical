# Mises a jour automatiques PROPOSEES (jamais appliquees seules): Dependabot ouvre
# une demande de fusion (pull request); le workflow de tests (ci.yml) la verifie;
# on la fusionne si tout est vert. Evite a la fois de rester sur des versions
# vulnerables ET de subir une mise a jour surprise (cf. incident scramp 1.5.0).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/frontend-web"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/desktop-app"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule: { interval: "monthly" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
